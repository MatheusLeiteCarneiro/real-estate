spring.application.name=RealEstate
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.output.ansi.enabled=ALWAYS

cloudinary.url=${CLOUDINARY_URL}
property.image.folder=${PROPERTY_IMAGE_FOLDER}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:100MB}

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

spring.data.web.pageable.serialization-mode=via-dto

jwt.public.key=${JWT_PUBLIC_KEY:file:./secrets/app.pub}
jwt.private.key=${JWT_PRIVATE_KEY:file:./secrets/app.key}

security.jwt.refresh-token-duration=${JWT_REFRESH_TOKEN_DURATION:604800}
security.jwt.access-token-duration=${JWT_ACCESS_TOKEN_DURATION:8000}
security.authorization-server.url=${AUTHORIZATION_SERVER_URL:http://localhost:8080}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

admin.username=${ADMIN_USERNAME}
admin.password=${ADMIN_PASSWORD}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.sql.init.mode=never

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
