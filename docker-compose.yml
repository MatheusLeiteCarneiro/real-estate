services:
  database:
    image: postgres:15-alpine
    container_name: realestate_db_container
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  redis:
    image: redis:7-alpine
    container_name: realestate_redis_container
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a \"${REDIS_PASSWORD}\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  migrations:
    image: flyway/flyway:11.14.1
    container_name: realestate_migrations_container
    command: -url=jdbc:postgresql://database:5432/${POSTGRES_DB} -user=${POSTGRES_USER} -password=${POSTGRES_PASSWORD} migrate
    volumes:
      - ./migrations/src/main/resources/db/migration:/flyway/sql
    depends_on:
      database:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: realestate-api:latest
    container_name: realestate_api_container
    ports:
      - "8080:8080"
    env_file:
      - .env
      - api/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      DB_HOST: database

      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

      JWK_SET_URI: http://auth-server:9000/oauth2/jwks

    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: always

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: realestate-auth-server:latest
    container_name: realestate_auth_server_container
    ports:
      - "9000:9000"
    env_file:
      - .env
      - auth-server/.env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}

      DB_HOST: database
      REDIS_HOST: redis

      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./auth-server/secrets:/app/secrets:ro
    restart: always

volumes:
  postgres_data:
  redis_data:
